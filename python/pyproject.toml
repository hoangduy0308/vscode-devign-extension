[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devign-scanner"
version = "1.0.0"
description = "CLI tool for detecting vulnerabilities in C/C++ code using deep learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Devign Team", email = "devign@example.com"}
]
keywords = [
    "security",
    "vulnerability",
    "scanner",
    "c",
    "cpp",
    "deep-learning",
    "static-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "onnxruntime>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
gpu = [
    "onnxruntime-gpu>=1.12.0",
]

[project.scripts]
devign = "devign.cli:main"

[project.urls]
Homepage = "https://github.com/hoangduy0308/vscode-devign-extension"
Documentation = "https://github.com/hoangduy0308/vscode-devign-extension#readme"
Repository = "https://github.com/hoangduy0308/vscode-devign-extension"
Issues = "https://github.com/hoangduy0308/vscode-devign-extension/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["devign*"]

[tool.setuptools.package-data]
devign = ["*.onnx", "*.json"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
